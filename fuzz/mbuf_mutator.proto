syntax = "proto2";

package dpvs;

enum IpVersion {
  IPV4 = 4;
  IPV6 = 6;
}


enum Protocol {
  IPPROTO_IP = 0;
  IPPROTO_ICMP = 1;
  IPPROTO_IGMP = 2;
  IPPROTO_IPIP = 4;
  IPPROTO_TCP = 6;
  IPPROTO_UDP = 17;
  //   so on..
}

// These can be used as-is for 32-bit ints.
// testing address
enum SrcAddr {
  IN4_SRC_ADDR_0 = 0;
  IN4_SRC_ADDR_BROADCAST = -1;
}

enum DstAddr {
  IN4_DST_ADDR_0 = 0;
  IN4_DST_ADDR_BROADCAST = -1;
}

enum Port {
  PORT_8000 = 8000;
}

enum TcpSeq {
  SEQ_1 = 1;
  SEQ_2 = 2;
  SEQ_3 = 3;
  SEQ_4 = 4;
  SEQ_5 = 5;
  SEQ_6 = 6;
  SEQ_7 = 7;
  SEQ_8 = 8;
}

enum TcpFlag {
  MY_TH_FIN = 1;
  MY_TH_SYN = 2;
  MY_TH_RST = 4;
  MY_TH_PUSH = 8;
  MY_TH_ACK = 16;
  MY_TH_URG = 32;
  MY_TH_ECE = 64;
  MY_TH_CWR = 128;
}

// TODO: add more ipv6 routing header types
enum Ip6RtType {
  MY_IPV6_RTHDR_TYPE_0 = 0;
}



// /* Ethernet frame types */
